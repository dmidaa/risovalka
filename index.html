<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Подпись</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
        }
        
        canvas {
            border: 4px solid #ff4d4d;
            border-radius: 10px;
            cursor: crosshair;
            background: white;
            display: block;
            margin: 0 auto;
        }
        
        .toolbar {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover { transform: scale(1.05); }
        
        .send-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }
        
        .clear-btn {
            background: linear-gradient(45deg, #ff4d4d, #ff3333);
            color: white;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
        
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .waiting { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #ff4d4d; text-align: center;">Подтверди подписью</h2>
        
        <canvas id="drawCanvas" width="500" height="400"></canvas>
        
        <div class="toolbar">
    <input type="color" id="colorPicker" value="#ff4d4d">
    <input type="range" id="brushSize" min="1" max="20" value="3">
    <span>🖌️ <span id="sizeValue">3</span>px</span>
    
    <button class="clear-btn" onclick="clearCanvas()">Очистить</button>
    <button class="send-btn" onclick="sendDrawing()">Подтвердить</button>
</div>

<!-- 👇 ДОБАВЬ ЭТИ ПОЛЯ СЮДА 👇 -->
<div style="margin-top: 20px; display: flex; gap: 10px; flex-direction: column;">
    <input type="text" id="message" placeholder="Сообщение (необязательно)" 
           style="padding: 12px; border-radius: 10px; border: 2px solid #ff4d4d; font-size: 16px;">
</div>
        
    </div>

    <script>
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        
        // Настройки рисования
        ctx.strokeStyle = '#ff4d4d';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        
        // Цвет и размер кисти
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            ctx.strokeStyle = e.target.value;
        });
        
        document.getElementById('brushSize').addEventListener('input', (e) => {
            ctx.lineWidth = e.target.value;
            document.getElementById('sizeValue').textContent = e.target.value;
        });
        
        // Рисование
        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = getCoordinates(e);
        }
        
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            
            const [x, y] = getCoordinates(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            
            [lastX, lastY] = [x, y];
        }
        
        function stopDrawing() { isDrawing = false; }
        
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return [(clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY];
        }
        
        // События
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
        
        // Очистка
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            statusDiv.textContent = '✅';
            statusDiv.className = 'status success';
        }
        
        // ============ ГЛАВНОЕ: ОТПРАВКА РИСУНКА НА ТВОЙ ПК ============
       function sendDrawing() {
    const status = document.getElementById('status');
    status.textContent = 'Подтверждение....';
    status.style.background = '#fff3cd';
    
    // Получаем canvas
    const canvas = document.getElementById('drawCanvas');
    
    canvas.toBlob((blob) => {
        const formData = new FormData();
        formData.append('drawing', blob, `drawing_${Date.now()}.png`);
        formData.append('message', document.getElementById('message').value);
        
        // 🔥 ТОЧНО ТАКОЙ ЖЕ URL, КАК В ТЕСТЕ!
        fetch('https://drawing-server.danilmurzin329.workers.dev', {
            method: 'POST',
            body: formData
        })
        .then(res => {
            if (!res.ok) {
                throw new Error(`HTTP error! status: ${res.status}`);
            }
            return res.json();
        })
        .then(data => {
            if (data.success) {
                status.textContent = '✅ Подтверждено!';
                status.style.background = '#d4edda';
            } else {
                throw new Error(data.error || 'Неизвестная ошибка');
            }
        })
        .catch(err => {
            console.error('Ошибка:', err);
            status.textContent = 'Ошибка: ' + err.message;
            status.style.background = '#f8d7da';
        });
    }, 'image/png');
}
        
        console.log('Good');
    </script>
</body>
</html>
